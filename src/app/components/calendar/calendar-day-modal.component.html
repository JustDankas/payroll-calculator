<h3>Edit Day</h3>
<p>{{ date | date: "fullDate" }}</p>

<mat-form-field appearance="outline" style="width: 100%; margin-top: 12px">
  <mat-label>Hours</mat-label>
  <input matInput type="number" [(ngModel)]="hours" min="0" step="0.5" />
</mat-form-field>

<mat-checkbox [(ngModel)]="isHoliday" style="margin-top: 8px"
  >Holiday</mat-checkbox
>

<div
  style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px"
>
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</div>
